# Oper Nginx Production Configuration (oper.bintangarama.cloud)
# Letakkan di /etc/nginx/sites-available/oper.conf dan symlink ke /etc/nginx/sites-enabled/
# Jalankan SSL: sudo certbot --nginx -d oper.bintangarama.cloud

# Rate limiting zones per IP address
limit_req_zone $binary_remote_addr zone=oper_join:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=oper_upload:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=oper_api:10m rate=120r/m;

# Log format khusus: hapus query string agar token sensitif (?t=...) TIDAK bocor ke access.log
log_format oper_privacy '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent"';

server {
    listen 80;
    server_name oper.bintangarama.cloud; # Domain Oper di VPS Anda

    # Redirect seluruh HTTP ke HTTPS jika menggunakan SSL (disarankan)
    # return 301 https://$host$request_uri;

    access_log /var/log/nginx/oper_access.log oper_privacy;
    error_log /var/log/nginx/oper_error.log warn;

    # Batas ukuran payload request (sedikit di atas batas upload 50MB)
    client_max_body_size 60M;

    # 1. Endpoint Server-Sent Events (SSE)
    # PENTING: Matikan buffering Nginx agar event langsung terdorong ke browser tanpa delay
    location ~ ^/api/rooms/[^/]+/events$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Header standar reverse proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Konfigurasi spesifik SSE
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Cegah proxy memutus koneksi streaming panjang
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # 2. Endpoint Upload File (Streaming langsung ke Go backend)
    # PENTING: proxy_request_buffering off agar Nginx tidak menyimpan file ke buffer /tmp Nginx dulu,
    # melainkan langsung meneruskannya ke backend Go secara streaming untuk progress realtime.
    location ~ ^/api/rooms/[^/]+/files$ {
        limit_req zone=oper_upload burst=10 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 3. Endpoint Join (PIN / QR) dengan rate limiting ketat
    location = /api/join {
        limit_req zone=oper_join burst=5 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Seluruh rute lainnya (Web UI, Download, Healthz, Room Management)
    location / {
        limit_req zone=oper_api burst=20 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
